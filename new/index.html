<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transfer</title>

    <style>
        :root {
            --primary-color: #4CAF50;
            --hover-color: #45a049;
            --bg-color: #f8f9fa;
            --text-color: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            background: var(--primary-color);
            color: white;
        }

        .btn:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>

    <script src="https://mis320.github.io/xiamicommunity/web3ex1.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>transfer</h1>
            <div class="blockchain-info">
                <span id="blockchainId"></span>
                <span id="blockchainName"></span>
            </div>
        </div>

        <div class="input-group">
            <label>Gas Price:</label>
            <textarea id="gasPrice" rows="2"></textarea>
        </div>

        <div class="input-group">
            <label>to:</label>
            <textarea id="toAccount" rows="2"></textarea>
        </div>

        <div class="input-group">
            <label>次数:</label>
            <textarea id="executionCount" rows="2">1</textarea>
        </div>

        <div class="input-group">
            <label>data:</label>
            <textarea id="dataField" rows="5">0x</textarea>
        </div>

        <div class="input-group">
            <label>fee:</label>
            <textarea id="feeAmount" rows="2">0</textarea>
        </div>

        <div class="input-group">
            <label>私钥:</label>
            <textarea id="privateKey" rows="8"></textarea>
        </div>

        <div class="input-group">
            <label>结果:</label>
            <textarea id="executionResult" rows="10"></textarea>
        </div>

        <div class="button-group">
            <button class="btn" id="batchExecute" onclick="start1()">批量执行</button>
            <button class="btn" id="continuousExecute" onclick="zx()">批量执行直到成功</button>
            <!-- <button class="btn" id="deployContract" onclick="deploy()">部署</button> -->
        </div>
    </div>

    <script>
        //授权
        {

            var bigAddress;
            var tokenName;
            var decimals;
            let web3Provider;
            var user;
            var gasPrice;
            var toAddress;
            var networkId;
            var executionResultElement = document.getElementById('executionResult');
            //授权
            {
                if (window.ethereum) {
                    web3Provider = window.ethereum;
                    (async () => {
                        try {
                            // 请求用户授权
                            await window.ethereum.request({ method: 'eth_requestAccounts' });
                        } catch (error) {

                            await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for 1 second before the next iteration
                            await window.ethereum.request({ method: 'eth_requestAccounts' });
                        }
                    })();
                }
                var web3 = new Web3(web3Provider); // web3js就是你需要的web3实例

                setTimeout(async () => {
                    while (true) {
                        let tempId = await web3.eth.net.getId(); // Update networkVersion each iteration
                        if (networkId != tempId) {
                            networkId = tempId;
                            document.getElementById('blockchainId').innerText = 'networkId: ' + networkId;
                            web3.eth.getGasPrice().then(gas => {
                                $set('gasPrice', web3.utils.fromWei(gas, 'gwei'))
                            });

                            //用小狐狸的api获取当前网络的名字

                            fetch('https://chainid.network/chains.json')
                                .then(response => response.json())
                                .then(data => {
                                    let networkName = data.find(chain => chain.chainId == networkId).name;
                                    document.getElementById('blockchainName').innerText = 'networkName: ' + networkName;
                                }).catch(error => {
                                    document.getElementById('blockchainName').innerText = 'networkName: chains-null';
                                });



                        }
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for 1 second before the next iteration
                    }
                }, 300);
            }
        }


        function addRes(params) {
            executionResultElement.innerHTML = executionResultElement.innerHTML + params + '\n =======================\n'
        }
        function restRes(params) {
            executionResultElement.innerHTML = ''
        }

        function zx() {
            let gasprice = web3.utils.toWei($get('gasPrice'), 'gwei')


            let to = $get('toAccount')
            let data = $get('dataField')
            if (data.length < 1) {
                data = '0x'
            }


            set('transferTo', to)
            set('transferData', data)
            let fee = web3.utils.toWei($get('feeAmount'), 'ether');
            let accounts = $get('privateKey');

            console.log(to);
            console.log(data);
            console.log(fee);
            console.log(accounts);


            web3.eth.accounts.wallet.clear();
            try {
                if (accounts.indexOf('----') != -1) {
                    let c = accounts.split('\n');
                    for (let index = 0; index < c.length; index++) {
                        const element = c[index];
                        let keys = element.split('----');
                        let key = keys[1];
                        let addre = keys[0];
                        web3.eth.accounts.wallet.add({
                            privateKey: key
                        });
                    }
                } else {
                    let c = accounts.split('\n');
                    for (let index = 0; index < c.length; index++) {
                        const element = c[index];
                        web3.eth.accounts.wallet.add({
                            privateKey: element
                        });
                    }
                }
            } catch (error) {

                console.log(web3.currentProvider.selectedAddress);
                send(web3.currentProvider.selectedAddress)
                return

            }


            var addressS = web3.eth.accounts.wallet;
            console.log(addressS);





            for (let index = 0; index < addressS.length; index++) {
                const element = addressS[index].address;
                console.log(element);

                let data0 = data
                if (data0.indexOf("{sender}")) {
                    data0 = data.replace("{sender}", element.slice(2).toLocaleLowerCase())
                }

                send(element, data0);
            }

            async function send(address, data) {
                let nonce = await getTransactionCount(address)
                let setIntervalId = setInterval(async () => {
                    try {
                        let gas = await web3.eth.estimateGas({
                            from: address,
                            to: to,
                            data: data,
                            value: fee
                        })
                        clearInterval(setIntervalId);
                        console.log(address + ": 正在发送事务中。。。。。", gas);
                        addRes('当前地址正在发送事务中----->：' + address)

                        web3.eth.sendTransaction({
                            from: address,
                            to: to,
                            data: data,
                            value: fee,
                            nonce: nonce,
                            gas: gas + parseInt(gas * 0.1) + '',//
                            gasPrice: gasprice
                        }).then(function (receipt) {

                            addRes('当前地址：' + address + "----->事务发送成功hash:" + receipt.transactionHash)
                            console.log('事务发送成功', receipt);
                        })
                    } catch (error) {
                        addRes('模拟重试中----->：' + address)
                    }




                }, 1000);



            }
        }


        async function getTransactionCount(account) {

            let nonce
            try {
                nonce = await web3.eth.getTransactionCount(account)
            } catch (error) {
                nonce = await getTransactionCount(account)
            }
            return nonce
        }

        function start1() {

            next();
        }


        async function next() {
            let gasprice = web3.utils.toWei($get('gasPrice'), 'gwei')


            let to = $get('toAccount')
            let data = $get('dataField')

            if (data.length < 1) {
                data = '0x'
            }
            set('transferTo', to)
            set('transferData', data)
            let fee = web3.utils.toWei($('feeAmount'), 'ether');
            let accounts = $get('privateKey');

            console.log(to);

            console.log(fee);
            console.log(accounts);


            /*  if (to.replace(' ', '') === '' || accounts.replace(' ', '') ==='') {
                 console.log(1);
                 return;
             } */
            console.log(accounts.indexOf('----'), '-----');




            web3.eth.accounts.wallet.clear();
            try {
                if (accounts.indexOf('----') != -1) {
                    let c = accounts.split('\n');
                    for (let index = 0; index < c.length; index++) {
                        const element = c[index];
                        let keys = element.split('----');
                        let key = keys[1];
                        let addre = keys[0];

                        console.log(addre);
                        web3.eth.accounts.wallet.add({
                            privateKey: key
                        });
                    }
                } else {
                    let c = accounts.split('\n');
                    for (let index = 0; index < c.length; index++) {
                        const element = c[index];
                        web3.eth.accounts.wallet.add({
                            privateKey: element
                        });
                    }
                }
            } catch (error) {

                const user = web3.currentProvider.selectedAddress
                console.log(user);

                send(user, data)
                return
            }
            var addressS = web3.eth.accounts.wallet;
            {
                for (let index = 0; index < addressS.length; index++) {
                    const element = addressS[index].address;
                    console.log(element);

                    send(element, data);
                    await new Promise(resolve => setTimeout(resolve, parseInt(400)));
                }
            }


            function restData(data, address) {
                let data0 = data
                if (data0.indexOf("{sender}") != -1) {
                    data0 = data0.replace("{sender}", address.slice(2).toLocaleLowerCase())
                }
                if (data0.indexOf("{date}") != -1) {
                    data0 = data0.replace("{date}", encodeParameters(["uint"], [getDate()]).slice(2).toLocaleLowerCase())
                }

                if (data0.indexOf("{hex}") != -1) {
                    let jtxt = data0.slice(5)
                    if (data0.indexOf("{random") != -1) {
                        let match = jtxt.match(/{random\((\d+),(\d+)\)}/)

                        console.log(match);
                        const min = parseInt(match[1]);
                        const max = parseInt(match[2]);
                        let rand = random(min, max)
                        console.log(data0);
                        console.log(rand);
                        data0 = data0.replace(match[0], rand)
                        // console.log(data0);
                    }
                    if (data0.indexOf("{random(1,21000)}") != -1) {

                    }
                    data0 = hexString(data0.slice(5))
                }
                // console.log(data0);
                return data0
            }


            async function send(address, data) {

                let num = parseInt($get('executionCount'))

                let nonce = await getTransactionCount(address)

                for (let index = 0; index < num; index++) {
                    let data0 = restData(data, address)
                    try {
                        web3.eth.estimateGas({
                            from: address,
                            to: to,
                            data: data0,
                            value: fee
                        }).then(gas => {
                            addRes('当前地址正在发送事务中----->：' + address)
                            console.log(address + ": 正在发送事务中。。。。。", gas);
                            web3.eth.sendTransaction({
                                from: address,
                                to: to,
                                nonce: nonce + index,
                                data: data0,
                                value: fee,
                                gas: gas + parseInt(gas * 0.1) + '',//
                                gasPrice: gasprice
                            }).then(function (receipt) {

                                console.log(receipt);
                                addRes('当前地址：' + address + "----->事务发送成功hash:" + receipt.transactionHash)
                            })
                        })
                    } catch (error) {
                        addRes('当前地址：' + address + "----->事务发送失败" + ' ' + String(error))
                    }

                    await new Promise((resolve) => setTimeout(resolve, 600));
                }



            }
        }

        function hexString(u8) {
            // const u8 = 'data:,{"p":"erc-20","op":"mint","tick":"eths","id":"7384","amt":"1000"}';
            // 将字符串转换为 UTF-8 编码的字节数组
            const utf8Bytes = new TextEncoder().encode(u8);
            console.log();
            // 将字节数组转换为十六进制字符串
            const hexString = Array.from(utf8Bytes).map(b => b.toString(16).padStart(2, '0')).join('');
            return hexString
        }

        function deploy() {
            let address = web3.currentProvider.selectedAddress
            let data = $get('dataField')
            web3.eth.estimateGas({
                from: address,
                data: data
            }).then(gas => {
                console.log(address + ": 正在发送事务中。。。。。", gas);
                web3.eth.sendTransaction({
                    from: address,
                    data: data
                }).then(function (receipt) {
                    console.log('事务发送成功', receipt);
                })
            })
        }



    </script>

    <script>


        var randomAry = [];
        function random(min, max, suffix = "") {
            let randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
            randomNum = randomNum + suffix;
            while (randomAry.includes(randomNum)) {
                let randomNum0 = Math.floor(Math.random() * (max - min + 1)) + min;
                randomNum = randomNum0 + suffix;
            }
            randomAry.push(randomNum);
            return randomNum;
        }

        function $set(p1, p2) {
            let t = document.getElementById(p1);
            t.value = p2
        }
        function $get(p1) {
            let t = document.getElementById(p1);
            return t.value
        }

        function weiForEth(num, decimals) {
            return num / Math.pow(10, decimals);
        }
        function ethForWei(num, decimals) {
            return (num + '') + (Math.pow(10, decimals) + '').replace('1', '');
        }
        function set(key, value) {
            localStorage.setItem(key, value);
        }
        function get(key) {
            return localStorage.getItem(key);
        }
        function del(key) {
            localStorage.setItem(key, "");
        }


        function getDate() {
            return new Date() / 1
        }


        function setlock(name, value) {
            localStorage.setItem("lock" + name, value);
        }
        function getlock(name) {
            return localStorage.getItem("lock" + name);
        }



        function setToken_Name(value) {
            localStorage.setItem("TONEN_NAME", value);
        }
        function getToken_Name(value) {
            return localStorage.getItem("TONEN_NAME");
        }

        function setdecimals(value) {
            localStorage.setItem("decimals", value);
        }

        function getsetdecimals() {
            return localStorage.getItem("decimals");
        }


        function setGas(value) {
            localStorage.setItem("gas", value);
        }
        function getGas() {
            return localStorage.getItem("gas");
        }

        const encodeParameters = (types, arg) => {
            return web3.eth.abi.encodeParameters(types, arg);
        }
        function init() {
            var init = document.getElementById("toAccount");
            var init2 = document.getElementById("dataField");
            init.value = get('transferTo');
            init2.value = get('transferData');
        }

        init()
    </script>

</body>

</html>
